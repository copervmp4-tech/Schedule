<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Windy Picnic</title>
  <meta name="description" content="An original one-minute animated short with Winnie-the-Pooh and Piglet, after A. A. Milne and E. H. Shepard (1926).">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="room">
    <section class="stage" id="stage" aria-label="The Windy Picnic, animated short">
      <canvas id="film" width="1920" height="1080" aria-hidden="true"></canvas>

      <div class="cover" id="cover">
        <button class="begin" id="begin" type="button" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg>
          <span id="beginLabel">Preparing the pages…</span>
        </button>
        <p class="cover-note" id="coverNote">Sound on · about one minute</p>
        <div class="loading" id="loading" aria-hidden="true"><span id="loadingBar"></span></div>
      </div>

      <div class="replay-card" id="replayCard" hidden>
        <button class="begin" id="replayBig" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L7.5 6.5 12 11V8a5 5 0 1 1-5 5H5a7 7 0 1 0 7-8z"/></svg>
          <span>Read it again</span>
        </button>
      </div>
      <p class="sr-only" id="captionLive" aria-live="polite"></p>
    </section>

    <nav class="controls" id="controls" aria-label="Playback controls">
      <button class="ctl" id="playPause" type="button" aria-label="Play" disabled>
        <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.6v14H7zM13.4 5H17v14h-3.6z"/></svg>
      </button>
      <button class="ctl" id="replay" type="button" aria-label="Replay from the beginning" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L7.5 6.5 12 11V8a5 5 0 1 1-5 5H5a7 7 0 1 0 7-8z"/></svg>
      </button>
      <div class="scrub" id="scrub" role="slider" tabindex="0" aria-label="Position" aria-valuemin="0" aria-valuemax="60" aria-valuenow="0">
        <div class="scrub-fill" id="scrubFill"></div>
      </div>
      <span class="time" id="time">0:00 / 1:00</span>
      <button class="ctl on" id="cc" type="button" aria-label="Subtitles" aria-pressed="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1zm2.5 4.2a2.3 2.3 0 0 0 0 3.6c.7.5 1.9.5 2.7-.1l-.6-1c-.5.3-1 .3-1.3.1a1 1 0 0 1 0-1.6c.3-.2.8-.2 1.3.1l.6-1c-.8-.6-2-.6-2.7-.1zm6 0a2.3 2.3 0 0 0 0 3.6c.7.5 1.9.5 2.7-.1l-.6-1c-.5.3-1 .3-1.3.1a1 1 0 0 1 0-1.6c.3-.2.8-.2 1.3.1l.6-1c-.8-.6-2-.6-2.7-.1z"/></svg>
      </button>
      <button class="ctl" id="mute" type="button" aria-label="Mute" aria-pressed="false">
        <svg class="i-vol" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4zM16 8.5a5 5 0 0 1 0 7l-1.1-1.1a3.4 3.4 0 0 0 0-4.8zM18.3 6.2a8.3 8.3 0 0 1 0 11.6l-1.1-1.1a6.7 6.7 0 0 0 0-9.4z"/></svg>
        <svg class="i-muted" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4zM15.5 9.6l1.1-1.1 2.4 2.4 2.4-2.4 1.1 1.1-2.4 2.4 2.4 2.4-1.1 1.1-2.4-2.4-2.4 2.4-1.1-1.1 2.4-2.4z"/></svg>
      </button>
      <button class="ctl" id="full" type="button" aria-label="Full screen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v2H6v4H4zm10 0h6v6h-2V6h-4zM4 14h2v4h4v2H4zm14 0h2v6h-6v-2h4z"/></svg>
      </button>
    </nav>

    <footer class="colophon">
      <p><em>The Windy Picnic</em> — an original short after <em>Winnie-the-Pooh</em> by A. A. Milne, with decorations by E. H. Shepard (1926).
        <a href="CREDITS.md">Credits &amp; sources</a> · keys: <kbd>Space</kbd> play/pause, <kbd>R</kbd> replay, <kbd>C</kbd> subtitles, <kbd>F</kbd> full screen, <kbd>←</kbd>/<kbd>→</kbd> seek</p>
    </footer>
  </main>

  <script src="js/util.js"></script>
  <script src="js/ink.js"></script>
  <script src="js/characters.js"></script>
  <script src="js/props.js"></script>
  <script src="js/world.js"></script>
  <script src="js/cloth.js"></script>
  <script src="js/film.js"></script>
  <script src="js/cues.js"></script>
  <script src="js/player.js"></script>
</body>
</html>
